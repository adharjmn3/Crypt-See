behaviors:
  ImprovedEnemyAI:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: null
      strength: 0.5
      steps: 10000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 50000
    threaded: true
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 10000
      play_against_latest_model_ratio: 0.5
      window: 10
